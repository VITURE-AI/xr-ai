# Always-on: the worker matches the wake word itself (fuzzy, per client, and
# with wake-free exits during guidance), so the gate forwards every
# transcript. A bare global STOP still interrupts speech.
magic_phrases: []
listening_chime: false
followup_grace_s: 0
