[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashscope-speech"
version = "0.1.0"
description = "OpenAI-compatible STT/TTS shim over hosted Alibaba DashScope speech models"
requires-python = ">=3.11,<3.13"
# httpx talks to DashScope's REST/SSE API directly; no vendor SDK. numpy is
# only used to resample inbound WAV to 16 kHz mono before upload.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "xr-ai-logging",
]

[project.scripts]
dashscope_speech = "dashscope_speech.__main__:run"

[dependency-groups]
# The wire tests drive the service with the upstream xr_ai_models clients.
dev = [
    "pytest>=8",
    "xr-ai-models",
]

[tool.uv.sources]
xr-ai-logging = { path = "../../../../utils/xr-ai-logging", editable = true }
xr-ai-models  = { path = "../../../../agent-sdk/xr-ai-models", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["dashscope_speech"]
