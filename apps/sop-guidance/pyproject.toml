[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-guidance"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-launcher",
    "xr-ai-logging",
]

[tool.uv.sources]
xr-ai-launcher = { path = "../../utils/xr-ai-launcher", editable = true }
xr-ai-logging  = { path = "../../utils/xr-ai-logging", editable = true }

[project.scripts]
sop_guidance = "main:run"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["worker", "guidance", "services/dashscope-speech", "tests"]
testpaths = ["tests", "eval"]
markers = [
  "gpu: requires local GPU, Docker, or NVENC",
  "integration: starts a real service process",
]
