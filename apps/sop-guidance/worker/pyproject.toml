[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-guidance-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nemo-relay>=0.7.2,<0.8",
    "xr-ai-agent-runtime",
    "xr-ai-hub-client",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-sop-guidance[vision,recorder]",
    # Procedure backends beyond the built-in vlm one. Each is its own package,
    # found by its `sop_guidance.backends` entry point; listing it here is all
    # it takes to make its procedures runnable.
    "sop-guidance-rpi-hat-judge",
    "xr-ai-tools",
    "xr-ai-voice",
    "xr-ai-voicegate",
    "fastapi>=0.115",
    "loguru>=0.7",
    "pyyaml>=6.0",
    # Direct only to route them to the CPU wheel index below.
    "torch>=2.4",
    "torchvision>=0.19",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # The speech shim tests run in this environment too.
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
xr-ai-agent-runtime = { path = "../../../agent-sdk/xr-ai-runtime", editable = true }
xr-ai-hub-client = { path = "../../../agent-sdk/xr-ai-hub", editable = true }
xr-ai-logging   = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-models    = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-sop-guidance = { path = "../guidance", editable = true }
sop-guidance-rpi-hat-judge = { path = "../backends/rpi-hat-judge", editable = true }
xr-ai-tools     = { path = "../../../agent-sdk/xr-ai-tools", editable = true }
xr-ai-voice     = { path = "../../../agent-sdk/xr-ai-voice", editable = true }
xr-ai-voicegate = { path = "../../../utils/xr-ai-voicegate", editable = true }
# The detectors run as OpenVINO exports on the CPU; ultralytics still imports
# torch, and the CPU wheel avoids pulling the CUDA stack for it.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
sop_guidance_worker = "sop_guidance_worker.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["sop_guidance_worker"]
